  <meta name="robots" content="index,follow,max-image-preview:large">
  <meta name="theme-color" content="#0f6bff">

  <script>
    (() => {
      const key = "sellermap-theme";
      try {
        const saved = localStorage.getItem(key);
        document.documentElement.dataset.theme = saved === "dark" || saved === "light"
          ? saved
          : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ContactPage",
      "name": "联系 SellerMap",
      "url": "https://sellermap.top/cn/contact.html",
      "inLanguage": "zh-CN",
      "mainEntity": {
        "@type": "Organization",
        "name": "SellerMap",
        "email": "sellermap.service@gmail.com"
      }
    }
  </script>
  <link rel="shortcut icon" href="../assets/images/sellermap.svg">
  <link rel="stylesheet" href="../assets/css/seller.css">
  <script defer src="../assets/js/theme.js"></script>
  <script defer src="../assets/js/adsense.js" data-config="../data/site-config.json" data-adsense-loader></script>
  <script defer src="../assets/js/analytics.js" data-config="../data/site-config.json" data-analytics-loader></script>
</head>
<body class="static-page" data-lang="zh">
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="返回 SellerMap 跨境导航">
      <span class="brand-mark">S</span>
      <span class="brand-copy">
        <strong class="brand-name">SellerMap</strong>
        <span class="brand-note">跨境导航</span>
      </span>
    </a>
    <div class="topbar-actions">
      <button class="theme-toggle" id="theme-toggle" type="button" data-theme-dark-label="黑色" data-theme-light-label="白色" aria-label="切换为黑色背景">
        <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 15.1A8.5 8.5 0 0 1 8.9 3.6 8.7 8.7 0 1 0 20.4 15Z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span class="theme-toggle-label">黑色</span>
      </button>
      <a class="language-switch" href="../en/contact.html" lang="en">EN</a>

  <main class="static-main">
    <section class="static-hero">

      <h1>有问题、建议或合作想法？</h1>
      <p>欢迎提交工具收录、内容纠错、产品推广和商务合作需求。我们会尽量在 2 个工作日内回复。</p>
    </section>

    <div class="contact-grid">
      <article class="static-card">
        <div class="static-card-icon" aria-hidden="true">✉</div>
        <h2>服务邮箱</h2>
        <p>这是 SellerMap 目前唯一的官方联系渠道。</p>
        <a class="email-link" href="mailto:sellermap.service@gmail.com">sellermap.service@gmail.com</a>
      </article>
      <article class="static-card">
        <h2>适合联系我们的内容</h2>
        <ul class="static-list">
          <li>推荐值得收录的跨境平台或工具</li>
          <li>反馈失效链接、错误描述或分类问题</li>
          <li>提交产品推广、Banner 或内容合作</li>
          <li>提出网站功能与使用体验建议</li>
        </ul>
      </article>
    </div>

    <footer class="footer">
      <strong>SellerMap</strong> · 为跨境电商从业者整理 · 2026
      <div class="footer-links">
        <a href="index.html">返回首页</a><span>·</span><a href="privacy.html">隐私政策</a>
      </div>
    </footer>
  </main>
