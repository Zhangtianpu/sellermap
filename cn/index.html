  <script>
    (() => {
      const key = "sellermap-theme";
      try {
        const saved = localStorage.getItem(key);
        const theme = saved === "dark" || saved === "light"
          ? saved
          : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "name": "SellerMap",
          "alternateName": "SellerMap 跨境导航",
          "url": "https://sellermap.top/",
          "description": "面向跨境电商卖家的平台、工具、物流、支付与运营资源导航。",
          "inLanguage": "zh-CN",
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://sellermap.top/cn/?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Organization",
          "name": "SellerMap",
          "url": "https://sellermap.top/",
          "email": "sellermap.service@gmail.com",
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "customer support",
            "email": "sellermap.service@gmail.com"
          }
        }
      ]
    }
  </script>
  <link rel="shortcut icon" href="../assets/images/sellermap.svg">
  <link rel="stylesheet" href="../assets/css/seller.css">
  <script defer src="../assets/js/theme.js"></script>
  <script defer src="../assets/js/seller.js"></script>
  <script defer src="../assets/js/adsense.js" data-config="../data/site-config.json" data-adsense-loader></script>
  <script defer src="../assets/js/analytics.js" data-config="../data/site-config.json" data-analytics-loader></script>
</head>
<body data-lang="zh" data-data-url="../data/sites.json">
  <header class="topbar">
    <button class="menu-toggle" type="button" aria-label="打开导航菜单" aria-controls="sidebar">
      <span></span>

    <a class="brand" href="#top" aria-label="SellerMap 跨境导航首页">
      <span class="brand-mark">S</span>
      <span class="brand-copy">
        <strong class="brand-name">SellerMap</strong>
        <span class="brand-note">跨境导航</span>
      </span>
    </a>
    <div class="topbar-actions">
      <span class="status-pill">精选 · 持续更新</span>
      <button class="theme-toggle" id="theme-toggle" type="button" data-theme-dark-label="黑色" data-theme-light-label="白色" aria-label="切换为黑色背景" title="切换为黑色背景">
        <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 15.1A8.5 8.5 0 0 1 8.9 3.6 8.7 8.7 0 1 0 20.4 15Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span class="theme-toggle-label">黑色</span>
      </button>
      <a class="language-switch" href="../en/index.html" lang="en">EN</a>

  </header>

  <aside class="sidebar" id="sidebar" aria-label="网站分类">

      <strong>SellerMap</strong><br>

  <div class="page" id="top">
    <main class="container">
      <section class="banner-carousel" id="banner-carousel" aria-label="产品推广" hidden>
        <div class="banner-viewport" id="banner-viewport"></div>
        <div class="banner-controls">

            <button class="banner-arrow" type="button" data-banner-prev aria-label="上一个推广">‹</button>
            <button class="banner-arrow" type="button" data-banner-next aria-label="下一个推广">›</button>
          </div>
          <div class="banner-dots" id="banner-dots"></div>
        </div>
      </section>

      <section class="search-panel">
        <div class="search-copy">
          <span class="search-eyebrow">✦ 跨境卖家工作台</span>
          <h1>找货、卖货和增长。</h1>
        </div>
        <div class="search-tools">
          <label class="search-shell" for="site-search">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <input id="site-search" type="search" autocomplete="off" placeholder="搜索平台、物流、支付...">
          </label>
          <div class="quick-links" id="quick-links">
            <span class="quick-label">热门：</span>
          </div>
        </div>
        <div class="stats">
          <span><strong id="category-total">12</strong> 个分类</span>
          <span><strong id="site-total">101</strong> 个精选网站</span>
          <span>按 <kbd>/</kbd> 快速搜索</span>
        </div>
      </section>

      <section class="main-content">
        <div class="content-toolbar">
          <h2>浏览全部</h2>
          <span class="result-count" id="result-count" aria-live="polite">当前显示 101 个网站</span>
        </div>
        <div id="sections"></div>
        <div class="empty-state" id="empty-state" hidden>
          <div>
            <div class="empty-icon" aria-hidden="true">⌕</div>

            <p>换一个关键词试试，例如“Amazon”“物流”或“支付”。</p>

      <footer class="footer">

        <div class="footer-links">
          <a href="contact.html">联系我们</a>
          <span>·</span>
          <a href="privacy.html">隐私政策</a>
